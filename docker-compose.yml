services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-devops-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
    volumes:
      - ./backend/devops_assistant.sqlite:/app/devops_assistant.sqlite
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-devops-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
